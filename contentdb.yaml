 - name: "Windows Runtime 3.0"
   id: windows-3.0
   kind: runtime
   xxh3sum: 0019c1c9a7a7cb10
   timestamp: 315532800 # mono fails to load assemblies with a zero mtime
   # GE-Proton run directly on Kazeta, without umu or the Steam
   # Linux Runtime container. Kazeta provides glibc, Mesa, X11/Wayland, audio, gnutls and the other
   # base libraries; the few Proton needs that Kazeta lacks (mostly 32-bit) are in .kazeta/share/lib,
   # from Arch packages. The registry is in layers merged at launch, so carts and saves carry no copy
   # of the runtime's registry; the user's Temp and the shader caches are kept out of the save
   post: |
     # protonfixes applies game fixes, which carts carry themselves, and `runinprefix` never runs
     # them, but importing it was most of the proton script's startup. Its drive mapping is in `run`
     mkdir .kazeta/share/proton/protonfixes
     cat > .kazeta/share/proton/protonfixes/__init__.py <<'EOF'
     def setup(*args): pass
     def setup_mount_drives(*args): pass
     def winetricks(*args): pass
     def setup_frame_rate(*args): pass
     def setup_local_shader_cache(*args): pass
     def setup_upscalers(*args): pass
     def execute(): pass
     EOF

     # create the prefix with Proton's own setup_prefix(), as its `run` verb does on first launch
     env -i PATH="$PATH" PYTHONDONTWRITEBYTECODE=1 python3 - <<'EOF'
     import importlib.machinery, importlib.util, os, sys
     proton_dir = os.path.abspath('.kazeta/share/proton')
     prefix = os.path.abspath('.kazeta/var/prefix')
     os.makedirs(prefix)
     os.symlink('.', prefix + '/pfx')
     os.environ['STEAM_COMPAT_DATA_PATH'] = prefix
     os.environ['STEAM_COMPAT_CLIENT_INSTALL_PATH'] = ''
     sys.argv = [proton_dir + '/proton', 'setup']
     sys.path.insert(0, proton_dir)
     loader = importlib.machinery.SourceFileLoader('proton', proton_dir + '/proton')
     proton = importlib.util.module_from_spec(importlib.util.spec_from_loader('proton', loader))
     loader.exec_module(proton)
     proton.g_proton = proton.Proton(proton_dir)
     proton.g_compatdata = proton.CompatData(prefix)
     proton.g_session = proton.Session()
     proton.g_session.nvidia_wine_dll_dir = None
     defaults = dict(proton.g_session.dlloverrides)
     proton.g_compatdata.setup_prefix()
     # setup_prefix() switches to DXVK and vkd3d-proton with overrides that `runinprefix` doesn't set
     with open('.kazeta/share/dlloverrides', 'w') as f:
         f.write(';'.join(f'{k}={v}' for k, v in proton.g_session.dlloverrides.items() if defaults.get(k) != v))
     EOF

     # left out for size, after the prefix setup that copies some of them: wine-gecko (embedded HTML,
     # ~210 MB), the Chinese/Japanese/Korean fonts (~90 MB), text-to-speech and speech recognition,
     # and VR. wine-mono stays: .NET and XNA games can't run without it
     p=.kazeta/share/proton/files
     rm -r $p/share/wine/gecko
     rm $p/share/fonts/{msyh.ttf,msyhbd.ttf,simsun.ttc,malgun.ttf,msgothic.ttc}
     rm -r $p/lib/*-linux-gnu/{libvosk.so,libonnxruntime.so*,libpiper*,libespeak-ng.so*} $p/share/espeak-ng-data $p/share/libtashkeel_model.ort
     rm -r $p/lib/x86_64-linux-gnu/libopenxr_loader.so* $p/share/openxr .kazeta/var/prefix/drive_c/{vrclient,openxr}
     find .kazeta/var/prefix/drive_c -xtype l -delete # the prefix's links to the removed fonts

     # Visual C++ 2015-2022 runtime and MFC, unpacked from Microsoft's redistributables: Steam installs
     # them for the games that need them, and Wine's own msvcp140 and friends are incomplete. Proton's
     # prefix already prefers native copies and registers the runtime as installed (launchers such as
     # Unreal's check). Proton's copies are removed first, as some are links
     win=.kazeta/var/prefix/drive_c/windows
     cabextract -q -d .redist/x64 .redist/VC_redist.x64.exe
     cabextract -q -d .redist/x64 .redist/x64/a12 .redist/x64/a13
     cabextract -q -d .redist/x86 .redist/VC_redist.x86.exe
     cabextract -q -d .redist/x86 .redist/x86/a10 .redist/x86/a11
     for f in .redist/x64/*.dll_amd64; do rm -f $win/system32/$(basename $f _amd64); cp $f $win/system32/$(basename $f _amd64); done
     for f in .redist/x86/*.dll_x86; do rm -f $win/syswow64/$(basename $f _x86); cp $f $win/syswow64/$(basename $f _x86); done
     # the same for Visual C++ 2010, 2012 and 2013, which older games need (msvcr100, msvcp110, ...);
     # Proton's prefix prefers native copies of these too. 2010's update for ATL and MFC
     # (msp_kb2565063.msp) is a binary patch, so it stays at SP1 (10.0.40219.1), as Steam's copy does
     for v in 2010 2012 2013; do
       for a in x64 x86; do
         d=.redist/$v-$a
         cabextract -q -d $d .redist/vcredist_${v}_$a.exe
         if [ $v = 2010 ]; then cabs=$d/vc_red.cab; else cabs="$d/a2 $d/a3"; fi
         cabextract -q -d $d/dll -F 'F_CENTRAL_*' $cabs
         if [ $a = x64 ]; then dir=system32; else dir=syswow64; fi
         for f in $d/dll/F_CENTRAL_*; do
           name=$(basename $f _$a); name=${name#F_CENTRAL_}.dll
           rm -f $win/$dir/$name
           cp $f $win/$dir/$name
         done
       done
     done
     # OpenAL Soft as the system OpenAL32.dll, for games that expect Creative's OpenAL to be installed
     cp .redist/openal/bin/Win64/soft_oal.dll $win/system32/OpenAL32.dll
     cp .redist/openal/bin/Win32/soft_oal.dll $win/syswow64/OpenAL32.dll
     mkdir -p .kazeta/share/licenses/openal-soft
     cp .redist/openal/COPYING .redist/openal/LICENSE-pffft .kazeta/share/licenses/openal-soft/
     rm -rf .redist # cabextract keeps the read-only flag some files in the installers have

     cd .kazeta/var/prefix
     mv system.reg.old system.reg # keep the MachineGuid of Proton's default prefix instead of a random one
     # only used when Proton updates the prefix, which runinprefix never does; they hold build paths
     rm pfx.lock config_info tracked_files
     rm -r dosdevices
     ln -s /tmp/kazeta-dosdevices dosdevices # filled by `run`
     # Proton links the prefix's DLLs and fonts with absolute paths
     root="$(realpath ../../..)"
     find . -type l -lname "$root/*" -exec sh -c 'ln -sfnr "$(readlink "$1")" "$1"' _ {} \;
     # the registry is the first layer of those `run` merges at launch
     for hive in system.reg user.reg userdef.reg; do
       mkdir -p ../../share/registry/$hive.d
       mv $hive ../../share/registry/$hive.d/00-runtime.reg
     done
     rmdir drive_c/users/steamuser/AppData/Local/Temp
     ln -s /tmp/kazeta-temp drive_c/users/steamuser/AppData/Local/Temp # made by `run`
     echo disable > .update-timestamp # the prefix is made with this Proton; an update would write its DLLs and registry to the save
   sources:
     - uri: "https://github.com/GloriousEggroll/proton-ge-custom/releases/download/GE-Proton11-12/GE-Proton11-12-x86_64.tar.gz"
       xxh3sum: 8ce3f337aa1c404e
       exclude:
         - GE-Proton11-12-x86_64/protonfixes # replaced in post
         - GE-Proton11-12-x86_64/files/share/xalia
         # bridge to Steam's on-screen keyboard; explorer waits for it at every start
         - GE-Proton11-12-x86_64/files/lib/wine/*-windows/tabtip.exe
         - GE-Proton11-12-x86_64/files/share/default_pfx/drive_c/windows/*/tabtip.exe
         # only loaded when an environment variable enables them
         - GE-Proton11-12-x86_64/files/lib/wine/d7vk
         - GE-Proton11-12-x86_64/files/lib/*-linux-gnu/libvkbasalt.so
         - GE-Proton11-12-x86_64/files/lib/*-linux-gnu/libVkLayer_*
         - GE-Proton11-12-x86_64/files/lib/*-linux-gnu/libdxvk_nvapi_vkreflex_layer.so
         - GE-Proton11-12-x86_64/files/share/vkbasalt
         - GE-Proton11-12-x86_64/files/share/pyroveil
         - GE-Proton11-12-x86_64/files/share/low_latency_layer
         - GE-Proton11-12-x86_64/files/share/steam-overlay-wayland
         - GE-Proton11-12-x86_64/files/share/dxvk-nvapi-vkreflex-layer
       include: GE-Proton11-12-x86_64
       destination: .kazeta/share/proton
     # runtime launcher script
     - type: inline
       destination: .kazeta/share/run
       executable: true
       content: |
         #! /bin/bash
         # the cart's Env lines (NAME=value), set as written (no shell expansion) for Proton. Read first, so
         # the runtime's settings below add to WINEDLLOVERRIDES and LD_LIBRARY_PATH instead of replacing them
         if [ -n "$3" ]; then
           while IFS= read -r var; do export "$var"; done < "$3"
         fi
         export WINEPREFIX="$PWD/.kazeta/var/prefix"
         export STEAM_COMPAT_DATA_PATH="$WINEPREFIX" # Proton uses its pfx, a link to itself
         # the registry is layered: the runtime's and the cart's keys (.kazeta/share/registry/<hive>.d/*.reg,
         # in name order, the runtime's in 00-runtime.reg), then what changed while the cart ran, kept in
         # the save (.kazeta/var/registry/<hive>). Wine gets the layers merged into its usual files, and
         # only its changes go back to the save, so carts and saves carry no copy of the runtime's registry
         hives="system.reg user.reg userdef.reg"
         save_registry() { # what Wine changed, relative to the runtime and the cart
           for hive in $hives; do
             if [ -e "$WINEPREFIX/$hive" ]; then
               .kazeta/share/regstack diff "$@" "$WINEPREFIX/$hive" .kazeta/var/registry/$hive \
                 .kazeta/share/registry/$hive.d/*.reg && rm "$WINEPREFIX/$hive"
             fi
           done
         }
         # Wine's files are still in the prefix after a launch that didn't finish, and in saves made before
         # the registry was layered; those hold another runtime's keys, so their deletions are left out
         if [ -d .kazeta/var/registry ]; then
           save_registry
         else
           mkdir -p .kazeta/var/registry
           save_registry --keep
         fi
         for hive in $hives; do
           saved=.kazeta/var/registry/$hive
           [ -e $saved ] || saved=
           .kazeta/share/regstack merge "$WINEPREFIX/$hive" .kazeta/share/registry/$hive.d/*.reg $saved || exit 1
         done
         # Wine adds ports and host drives to dosdevices at every start; the prefix links it to /tmp to
         # keep them out of the save. The cart is X: and U:-W: are mapped as umu did; some games need W:
         dev=/tmp/kazeta-dosdevices
         rm -rf $dev
         mkdir -p $dev
         ln -s "$WINEPREFIX/drive_c" $dev/c:
         ln -s "$PWD" $dev/x:
         ln -s /media $dev/u:
         ln -s /run/media $dev/v:
         ln -s /mnt $dev/w:
         ln -s / $dev/z:
         # the user's Temp links to /tmp too, emptied at each launch, so temporary files stay out of the save
         rm -rf /tmp/kazeta-temp
         mkdir -p /tmp/kazeta-temp
         export PROTON_USE_XALIA=${PROTON_USE_XALIA:-0} # gamepad navigation for launchers, kept running next to the game
         export WINEDLLOVERRIDES="$(cat .kazeta/share/dlloverrides)${WINEDLLOVERRIDES:+;$WINEDLLOVERRIDES}"
         # libraries Proton needs that the host may lack. They come after the host's own library directories,
         # so they only fill in what the host is missing: the host's copies match its config and plugin paths
         # (ALSA, libva) and its Mesa, which a bundled copy found first would replace. ld.so skips directories
         # of the other architecture. The pulseaudio directories keep the host's libpulse on its own
         # libpulsecommon, as LD_LIBRARY_PATH comes before the path libpulse finds it in
         host=/usr/lib64:/usr/lib32:/usr/lib/x86_64-linux-gnu:/usr/lib/i386-linux-gnu:/usr/lib
         host=$host:/usr/lib64/pulseaudio:/usr/lib32/pulseaudio:/usr/lib/x86_64-linux-gnu/pulseaudio:/usr/lib/i386-linux-gnu/pulseaudio:/usr/lib/pulseaudio
         export LD_LIBRARY_PATH="${LD_LIBRARY_PATH:+$LD_LIBRARY_PATH:}$host:$PWD/.kazeta/share/lib/x86_64-linux-gnu:$PWD/.kazeta/share/lib/i386-linux-gnu"
         export PYTHONDONTWRITEBYTECODE=1 # the proton script would otherwise write its bytecode to the save
         # winspool adds the host's CUPS printers to the prefix (PPDs in system32/spool/drivers, entries in
         # system.reg and user.reg), which would end up in the save; without a server libcups finds none
         export CUPS_SERVER=/dev/null
         # with GLX, Wine probes OpenGL through a 1x1 window that gamescope briefly shows full screen
         export WINE_USE_EGL=${WINE_USE_EGL:-1}
         # shader caches go to the cache directory (left out when saves are copied) instead of the
         # prefix's AppData (DXVK) and the game's working directory (vkd3d-proton)
         cache="${XDG_CACHE_HOME:-$PWD/.cache}"
         mkdir -p "$cache/dxvk" "$cache/vkd3d-proton"
         export DXVK_SHADER_CACHE_PATH="$cache/dxvk" VKD3D_SHADER_CACHE_PATH="$cache/vkd3d-proton"
         # an absolute path: proton derives WINEDLLPATH from it, and Wine fails to load vkd3d (needed
         # by wined3d, so by d3dx9/d3dcompiler) from a relative one with status c000003b
         proton="$PWD/.kazeta/share/proton/proton"
         # Exec runs from the cart's Path (relative to the cart root) when the launcher passes one
         (cd "${2:-.}" && bash -c "\"$proton\" runinprefix $(cat $1)")
         rc=$?
         # let wineserver end Wine's own processes before exiting: gamescope's reaper sends SIGTERM to
         # everything left once this script exits, wineserver dies from it, and Wine processes only act on
         # SIGTERM through wineserver, so one that gets it after wineserver is gone (usually winedevice.exe)
         # waits in ntsync forever and gamescope never exits. Kill whatever outlives the game by 10 seconds
         wineserver="$PWD/.kazeta/share/proton/files/bin/wineserver"
         timeout 10 "$wineserver" -w || "$wineserver" -k
         save_registry
         exit $rc
